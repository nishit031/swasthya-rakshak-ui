[project]
name = "swasthya-ocr-service"
version = "0.1.0"
description = "Routed OCR / document-understanding microservice for Swasthya Rakshak (CPU MVP)."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query", "fastapi.Depends"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # Paddle/pypdfium2/cv2 ship no stubs
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
